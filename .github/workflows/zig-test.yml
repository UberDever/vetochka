name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# vetochka is built in a workspace: mine, with vetochka and muh-build checked out inside it.
jobs:
  zig:
    name: zig ${{ matrix.flags }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        flags: ["", "-Dsanitize=true"]
    steps:
      - uses: actions/checkout@v5
        with: { repository: UberDever/mine }
      - uses: actions/checkout@v5
        with: { path: vetochka }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.15.1 }
      - name: Install GCC ASan runtime
        if: matrix.flags != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-11
      - name: Run tests
        working-directory: vetochka
        run: zig build test-all -Dworkspace="$GITHUB_WORKSPACE" ${{ matrix.flags }} --summary all

  muh-build:
    name: muh-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { repository: UberDever/mine }
      - uses: actions/checkout@v5
        with: { path: vetochka }
      - uses: actions/checkout@v5
        with: { repository: UberDever/muh-build, path: muh-build }
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Build vetochka
        run: lua5.4 muh-build/scripts/cli.lua vetochka/recipe.lua --log plain
